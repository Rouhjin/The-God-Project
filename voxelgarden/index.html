<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voxelgarden</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><rect width=%2216%22 height=%226%22 fill=%22%236cc551%22/><rect y=%226%22 width=%2216%22 height=%2210%22 fill=%22%23a97b50%22/></svg>" />
  <style>
    :root {
      --cream: #fff6e5;
      --ink: #2e2a26;
      --apricot: #ff9e64;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0c1030; }
    body {
      font-family: ui-rounded, "Hiragino Maru Gothic ProN", Quicksand, Comfortaa, Manjari, "Arial Rounded MT", "Arial Rounded MT Bold", Calibri, source-sans-pro, sans-serif;
      color: var(--ink);
      user-select: none;
      -webkit-user-select: none;
    }
    #app { position: fixed; inset: 0; }
    #app canvas { display: block; }
    /* subtle storybook vignette */
    #vignette {
      position: fixed; inset: 0; pointer-events: none; z-index: 5;
      background: radial-gradient(ellipse at center, rgba(0,0,0,0) 62%, rgba(38,22,8,0.28) 100%);
    }
    #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="vignette"></div>
  <div id="hud"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
