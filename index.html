<script>
'use strict';
/* =========================================================================
   CHROMOPUNK: RESONATORS — VIN'S ESCAPE
   A fan game set in the Chromopunk Universe world bible.
   May 31, 2084, 23:54 — CBE containment fails during the Fourfold Fall.
   Get Vin out. Reach the Dead Rail. The person is the final colony.
   ========================================================================= */

// ------------------------------------------------------------------ consts
const VW = 960, VH = 540, TILE = 32;
const EMPTY=0, SOLID=1, PLAT=2, SPIKE=3, LIQ=4, CRACK=5, BARR=6, DOOR=7;

const SPECTRA = {

};
const SPEC_ORDER = ['volt','fire','ice','earth'];
const COL = {
  wind:'#b8ffe0', blood:'#ff4a6a', water:'#4aa8ff',
  hp:'#69e07c', charge:'#3ce0ff', rot:'#ff2fa0',
  dim:'#5a6a8a', ink:'#cfe6ff', warn:'#ff5555',
};

const SHARD_LORE = [
  'MATAGORDA COMPACT, ART. XIII — "Expiration ends extraordinary authority while leaving ordinary licenses, patents, contracts, and physical ownership intact."',
  'BEA-V7 is not a superpower gene. It is a rare regulatory complex. The breakthrough was not finding magical blood — it was forcing the body into a new energetic state.',

  'BLOODLINE CAMPAIGN COPY — "Do Not Turn Off the Future."',

  'CITYHEART AUTHORIZATION — Elik: biological authentication. Tomas: tactical authority. Vin: Confluence routing. A city whose deepest systems require three exploited children.',

  'CHARTER MARGIN NOTE, F. RODRÍGUEZ — "Does dependence create ownership? Every empire answers yes."',
];

// ------------------------------------------------------------------ utils
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>a+Math.random()*(b-a);
const irnd=(a,b)=>Math.floor(rnd(a,b+1));
const dist2=(ax,ay,bx,by)=>{const dx=ax-bx,dy=ay-by;return dx*dx+dy*dy;};
function fmtTime(s){ s=Math.floor(s); const m=Math.floor(s/60); return m+':'+String(s%60).padStart(2,'0'); }

// ------------------------------------------------------------------ audio
const Snd = {
  ctx:null, muted:false, mgain:null, sgain:null, musTimer:null, step:0, nextT:0, tempo:0.135,
  init(){
    if(this.ctx){ if(this.ctx.state==='suspended') this.ctx.resume(); return; }
    try{
      this.ctx = new (window.AudioContext||window.webkitAudioContext)();
      this.sgain = this.ctx.createGain(); this.sgain.gain.value=0.5; this.sgain.connect(this.ctx.destination);
      this.mgain = this.ctx.createGain(); this.mgain.gain.value=0.32; this.mgain.connect(this.ctx.destination);
      this.nextT = this.ctx.currentTime+0.1;
      this.musTimer = setInterval(()=>this.schedule(), 40);
    }catch(e){ /* audio unavailable */ }
  },
  tone(f,dur,type,vol,slide,delay){
    if(!this.ctx||this.muted) return;
    const t=this.ctx.currentTime+(delay||0);
    const o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type=type||'square'; o.frequency.setValueAtTime(f,t);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(20,f+slide), t+dur);
    g.gain.setValueAtTime(vol||0.15,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(this.sgain); o.start(t); o.stop(t+dur+0.02);
  },
  noise(dur,vol,delay,hp){
    if(!this.ctx||this.muted) return;
    const t=this.ctx.currentTime+(delay||0);
    const n=Math.floor(this.ctx.sampleRate*dur);
    const buf=this.ctx.createBuffer(1,n,this.ctx.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
    const src=this.ctx.createBufferSource(); src.buffer=buf;
    const g=this.ctx.createGain(); g.gain.value=vol||0.2;
    if(hp){ const f=this.ctx.createBiquadFilter(); f.type='highpass'; f.frequency.value=hp; src.connect(f); f.connect(g); }
    else src.connect(g);
    g.connect(this.sgain); src.start(t);
  },
  sfx(name){
    switch(name){
      case 'jump': this.tone(300,0.12,'square',0.08,220); break;
      case 'dash': this.noise(0.14,0.14,0,900); this.tone(700,0.1,'sawtooth',0.05,-350); break;
      case 'volt': this.tone(1400,0.08,'square',0.09,-900); this.noise(0.05,0.06,0,2500); break;
      case 'fire': this.noise(0.25,0.16,0,500); this.tone(160,0.2,'sawtooth',0.07,-60); break;
      case 'ice': this.tone(1900,0.12,'triangle',0.1,-700); break;
      case 'slam': this.tone(70,0.3,'sine',0.3,-30); this.noise(0.22,0.22,0,200); break;
      case 'heal': this.tone(520,0.15,'sine',0.1,140); this.tone(780,0.2,'sine',0.08,120,0.1); break;
      case 'hit': this.noise(0.08,0.15,0,1200); break;
      case 'hurt': this.tone(180,0.22,'sawtooth',0.16,-90); this.noise(0.12,0.12,0,300); break;
      case 'die': this.tone(220,0.5,'sawtooth',0.16,-160); this.noise(0.4,0.2,0,150); break;
      case 'pick': this.tone(880,0.09,'square',0.08,240); this.tone(1320,0.12,'square',0.06,180,0.07); break;
      case 'shard': this.tone(660,0.1,'triangle',0.1,0); this.tone(990,0.12,'triangle',0.09,0,0.09); this.tone(1320,0.18,'triangle',0.08,0,0.18); break;
      case 'check': this.tone(440,0.12,'sine',0.1,0); this.tone(660,0.16,'sine',0.1,0,0.1); this.tone(880,0.22,'sine',0.09,0,0.2); break;
      case 'unlock': this.tone(392,0.14,'square',0.09,0); this.tone(523,0.14,'square',0.09,0,0.11); this.tone(784,0.28,'square',0.1,0,0.22); break;
      case 'door': this.tone(120,0.3,'sawtooth',0.12,60); this.noise(0.2,0.1,0.1,400); break;
      case 'boom': this.tone(60,0.5,'sine',0.35,-25); this.noise(0.5,0.3,0,120); break;
      case 'eshot': this.tone(520,0.1,'sawtooth',0.06,-260); break;
      case 'alarm': this.tone(880,0.3,'square',0.05,-140); this.tone(880,0.3,'square',0.05,-140,0.4); break;
      case 'cascade': this.tone(1000,0.6,'sawtooth',0.14,-800); this.noise(0.5,0.25,0,600); break;
      case 'roar': this.tone(90,0.7,'sawtooth',0.24,-40); this.noise(0.6,0.2,0.05,180); break;
    }
  },
  // minimal dark loop: kick / hat / bass arp. intensity from game state.
  schedule(){
    if(!this.ctx||this.muted) return;
    const BASS=[55,0,55,0, 65.4,0,55,0, 49,0,55,0, 73.4,0,65.4,0]; // A C A G D C-ish
    while(this.nextT < this.ctx.currentTime+0.12){
      const s=this.step%16, t=this.nextT;
      const boss = game.bossActive;
      const playing = game.state==='play'||game.state==='pause';
      if(playing){
        if(s%4===0){ // kick
          const o=this.ctx.createOscillator(),g=this.ctx.createGain();
          o.type='sine'; o.frequency.setValueAtTime(110,t); o.frequency.exponentialRampToValueAtTime(38,t+0.11);
          g.gain.setValueAtTime(0.5,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.13);
          o.connect(g);g.connect(this.mgain);o.start(t);o.stop(t+0.15);
        }
        if(s%2===1){ // hat
          const n=this.ctx.createBufferSource(); const len=Math.floor(this.ctx.sampleRate*0.03);
          const b=this.ctx.createBuffer(1,len,this.ctx.sampleRate); const d=b.getChannelData(0);
          for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
          n.buffer=b; const f=this.ctx.createBiquadFilter(); f.type='highpass'; f.frequency.value=6000;
          const g=this.ctx.createGain(); g.gain.value = (s%8===5)?0.12:0.06;
          n.connect(f);f.connect(g);g.connect(this.mgain);n.start(t);
        }
        const bf=BASS[s];
        if(bf){
          const o=this.ctx.createOscillator(),g=this.ctx.createGain(),f=this.ctx.createBiquadFilter();
          o.type='sawtooth'; o.frequency.value=bf*(boss?2:1);
          f.type='lowpass'; f.frequency.value=boss?900:420;
          g.gain.setValueAtTime(0.16,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.12);
          o.connect(f);f.connect(g);g.connect(this.mgain);o.start(t);o.stop(t+0.14);
        }
        if(boss && s%8===3){
          const o=this.ctx.createOscillator(),g=this.ctx.createGain();
          o.type='square'; o.frequency.value=440*Math.pow(2,[0,3,7,10][irnd(0,3)]/12);
          g.gain.setValueAtTime(0.05,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.2);
          o.connect(g);g.connect(this.mgain);o.start(t);o.stop(t+0.22);
        }
      }
      this.nextT += this.tempo*(game.bossActive?0.82:1);
      this.step++;
    }
  }
};

// ------------------------------------------------------------------ input
const Input = {
  l:false,r:false,up:false,down:false,act:false,dash:false,heal:false,
  jumpBuf:0, confirm:false, _prev:{},
  press:{}, // edge-triggered
  init(){
    addEventListener('keydown',e=>{
      const k=e.key.toLowerCase();
      if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k)) e.preventDefault();
      Snd.init();
      if(!e.repeat) this.press[k]=true;
      this.setKey(k,true);
    });
    addEventListener('keyup',e=>this.setKey(e.key.toLowerCase(),false));
    // touch buttons
    const bind=(id,prop)=>{
      const el=document.getElementById(id);
      const on=ev=>{ev.preventDefault(); Snd.init(); el.classList.add('on'); this[prop]=true; if(prop==='up')this.press['touchjump']=true; if(prop==='act')this.press.touchact=true;};
      const off=ev=>{ev.preventDefault(); el.classList.remove('on'); this[prop]=false;};
      el.addEventListener('pointerdown',on); el.addEventListener('pointerup',off);
      el.addEventListener('pointercancel',off); el.addEventListener('pointerleave',off);
    };
    bind('tL','l'); bind('tR','r'); bind('tJ','up'); bind('tA','act'); bind('tD','dash'); bind('tH','heal');
    document.getElementById('tS').addEventListener('pointerdown',e=>{e.preventDefault(); this.press.q=true;});
    document.getElementById('tP').addEventListener('pointerdown',e=>{e.preventDefault(); this.press.p=true;});
    canvas.addEventListener('pointerdown',()=>{ Snd.init(); this.press.enter=true; });
    if('ontouchstart' in window) document.body.classList.add('touchy');
  },
  setKey(k,v){
    if(k==='arrowleft'||k==='a') this.l=v;
    if(k==='arrowright'||k==='d') this.r=v;
    if(k==='arrowup'||k==='w'||k===' ') this.up=v;
    if(k==='arrowdown'||k==='s') this.down=v;
    if(k==='j'||k==='z') this.act=v;
    if(k==='k'||k==='x'||k==='shift') this.dash=v;
    if(k==='l'||k==='c'||k==='h') this.heal=v;
  },
  pop(k){ if(this.press[k]){ this.press[k]=false; return true; } return false; },
  clearPress(){ this.press={}; }
};

// ------------------------------------------------------------------ grid helpers
function makeGrid(w,h){ return {w,h,c:new Uint8Array(w*h)}; }
function gset(g,x,y,v){ if(x>=0&&y>=0&&x<g.w&&y<g.h) g.c[y*g.w+x]=v; }
function gget(g,x,y){ if(x<0||x>=g.w) return SOLID; if(y<0) return EMPTY; if(y>=g.h) return EMPTY; return g.c[y*g.w+x]; }
function fillRect(g,x1,y1,x2,y2,v){ for(let y=y1;y<=y2;y++) for(let x=x1;x<=x2;x++) gset(g,x,y,v); }
function isSolidCode(c){ return c===SOLID||c===CRACK||c===BARR||c===DOOR; }

// ------------------------------------------------------------------ stage definitions
function stage1(){

  S.push({type:'trigger',tx:2,tx2:6,props:{lines:[

  pit(22,24,SPIKE); R(27,12,29,12,PLAT);

  pit(41,44,SPIKE);
  S.push({type:'vent',tx:50,ty:15});

  S.push({type:'drone',tx:59,ty:10,props:{docile:1}});

  S.push({type:'check',tx:64,ty:15});
  S.push({type:'trigger',tx:66,tx2:69,props:{unlock:'volt',lines:[

    ['TOMAS','...Ow. Okay. Hi, choompa. I burned the control rack on my way out — Kade is going to be furious.'],

  S.push({type:'junction',tx:74,ty:13,props:{door:1}});
  R(79,12,79,14,DOOR); S.push({type:'door',tx:79,ty:12,props:{id:1,h:3}});
  S.push({type:'trigger',tx:75,tx2:78,props:{lines:[
    ['TOMAS','Sealed. See the junction box? Put a bolt in it. Trust me, it\'s therapeutic.'],
  ]}});
  // combat teach
  S.push({type:'cell',tx:83,ty:14});
  S.push({type:'drone',tx:88,ty:10});
  pit(92,95,LIQ); R(93,13,94,13,PLAT);
  S.push({type:'drone',tx:98,ty:9});
  S.push({type:'cell',tx:100,ty:14});
  S.push({type:'guard',tx:105,ty:15});
  // high road / low road
  R(114,12,116,12,PLAT); R(119,9,121,9,PLAT);
  R(124,8,140,9,SOLID);
  R(126,14,129,14,SPIKE); R(133,14,136,14,SPIKE);
  S.push({type:'guard',tx:131,ty:8});
  S.push({type:'shard',tx:120,ty:8,props:{lore:1}});
  S.push({type:'cell',tx:138,ty:7});
  S.push({type:'drone',tx:146,ty:10});
  S.push({type:'check',tx:151,ty:15});
  R(156,11,158,11,PLAT);
  S.push({type:'shard',tx:157,ty:10,props:{lore:2}});
  S.push({type:'trigger',tx:158,tx2:161,props:{lines:[
    ['SANA','Service elevator, end of the hall. It reads as a med-waste lift so nobody watches it. Vin — when you\'re out... don\'t come back for me. I mean it.'],
    ['ELIK','She looped the cameras for us. Remember her name.'],
  ]}});
  S.push({type:'exit',tx:164,ty:15});
  return {grid:g,spawns:S,px:3,py:15,W,H,theme:'lab',
    name:'CONTAINMENT', sub:'CBE Deep Levels · Bloodline Meridian', clock:[54,77]};
}

function stage2(){

function rebuildEnts(){
  const st=game.stage; game.ents=[];
  st.spawns.forEach((sp,i)=>{
    const f=game.flags[i];
    if(f.dead||f.taken) return;
    game.ents.push(makeEnt(sp,i,f));
  });
}
function makeEnt(sp,i,f){
  const p=sp.props||{};
  const e={type:sp.type,idx:i,props:p,tx:sp.tx,ty:sp.ty,t:rnd(0,6)};
  const gx=sp.tx*TILE, gy=sp.ty*TILE;
  switch(sp.type){
    case 'drone': Object.assign(e,{x:gx+1,y:gy+5,w:30,h:22,hp:f.hp??25,dir:1,fireT:rnd(0.5,1.5),frozen:0,stun:0,bx:gx+1,by:gy+5,drop:0}); break;
    case 'guard': Object.assign(e,{x:gx+4,y:gy-40,w:24,h:40,hp:f.hp??40,dir:-1,fireT:0,burst:0,alert:0,frozen:0,stun:0,drop:0}); break;
    case 'null': Object.assign(e,{x:gx,y:gy-46,w:30,h:46,hp:f.hp??80,dir:-1,frozen:0,stun:0,pulse:0,drop:0}); break;
    case 'turret': Object.assign(e,{x:gx+3,y:gy+3,w:26,h:26,hp:f.hp??60,fireT:1,tel:0,ang:0}); break;
    case 'boss': Object.assign(e,{x:gx,y:gy-92,w:84,h:92,vx:0,vy:0,hp:f.hp??760,maxhp:760,dir:-1,st:'idle',stT:0,frozen:0,stun:0,phase:1,spawnT:0,drop:0}); break;
    case 'vent': Object.assign(e,{x:gx,y:gy,frozen:0,phase:p.phase||0}); break;
    case 'junction': Object.assign(e,{x:gx,y:gy,on:!!f.on}); break;
    case 'door': Object.assign(e,{x:gx,y:gy,open:!!f.open}); break;
    case 'barr': Object.assign(e,{x:gx,y:gy,hp:f.hp??(p.hp||3)}); break;
    case 'cell': case 'med': case 'rep': case 'shard':
      Object.assign(e,{x:gx+16,y:gy+16,respT:0}); break;
    case 'check': Object.assign(e,{x:gx+16,y:gy,on:!!f.on}); break;
    case 'exit': Object.assign(e,{x:gx+16,y:gy}); break;
    case 'trigger': Object.assign(e,{x1:sp.tx*TILE,x2:(sp.tx2+1)*TILE,done:!!f.done}); break;
  }
  return e;
}

function takeSnapshot(){
  game.snapshot={
    grid:new Uint8Array(game.grid.c),
    flags:JSON.parse(JSON.stringify(game.flags)),
    run:JSON.parse(JSON.stringify(run)),
    px:player.x,py:player.y,rot:player.rot,
  };
}
function restoreSnapshot(){
  const s=game.snapshot;
  game.grid.c.set(s.grid);
  game.flags=JSON.parse(JSON.stringify(s.flags));
  const savedRun=JSON.parse(JSON.stringify(s.run));
  const deaths=run.deaths, time=run.time;
  Object.assign(run,savedRun); run.deaths=deaths; run.time=time;
  game.projs=[]; game.fx=[]; game.bossActive=false; game.boss=null;
  rebuildEnts();
  player.x=s.px; player.y=s.py; player.vx=0; player.vy=0;
  player.hp=100; player.charge=70; player.rot=Math.min(s.rot,30);
  player.dead=false; player.inv=1.5; player.lock=0; player.dashT=0;
  game.dlg=[]; run.maxX=player.x;

// ------------------------------------------------------------------ collision
function solidAt(px,py,forEnemy){
  const c=gget(game.grid,Math.floor(px/TILE),Math.floor(py/TILE));
  return isSolidCode(c);
}
function moveBody(b,dt){
  // horizontal
  b.x+=b.vx*dt;
  if(b.vx>0){
    const x=b.x+b.w;
    if(solidAt(x,b.y+2)||solidAt(x,b.y+b.h/2)||solidAt(x,b.y+b.h-2)){
      b.x=Math.floor(x/TILE)*TILE-b.w-0.01; b.vx=0; b.hitWall=1;
    } else b.hitWall=0;
  } else if(b.vx<0){
    const x=b.x;
    if(solidAt(x,b.y+2)||solidAt(x,b.y+b.h/2)||solidAt(x,b.y+b.h-2)){
      b.x=(Math.floor(x/TILE)+1)*TILE+0.01; b.vx=0; b.hitWall=1;
    } else b.hitWall=0;
  }
  // vertical
  const prevBot=b.y+b.h;
  b.y+=b.vy*dt;
  b.onG=false;
  if(b.vy>=0){
    const y=b.y+b.h;
    const x1=b.x+2,x2=b.x+b.w-2;
    const ty=Math.floor(y/TILE);
    for(const x of [x1,(x1+x2)/2,x2]){
      const c=gget(game.grid,Math.floor(x/TILE),ty);
      if(isSolidCode(c) || (c===PLAT && prevBot<=ty*TILE+6 && b.drop<=0)){
        b.y=ty*TILE-b.h-0.01; b.vy=0; b.onG=true; break;
      }
    }
  } else {
    const y=b.y;
    const x1=b.x+2,x2=b.x+b.w-2;
    for(const x of [x1,x2]){
      if(solidAt(x,y)){ b.y=(Math.floor(y/TILE)+1)*TILE+0.01; b.vy=0; break; }
    }
  }
}
function groundAhead(e){
  const x=e.dir>0? e.x+e.w+4 : e.x-4;
  const c=gget(game.grid,Math.floor(x/TILE),Math.floor((e.y+e.h+8)/TILE));
  return c===SOLID||c===PLAT||c===CRACK||c===BARR||c===DOOR;
}

// ------------------------------------------------------------------ player
function updatePlayer(dt){
  const P=player;
  if(P.dead){
    P.deadT-=dt;
    if(P.deadT<=0){ restoreSnapshot(); }
    return;
  }
  P.inv=Math.max(0,P.inv-dt); P.atkCd=Math.max(0,P.atkCd-dt);
  P.dashCd=Math.max(0,P.dashCd-dt); P.lock=Math.max(0,P.lock-dt);
  P.healFx=Math.max(0,P.healFx-dt); P.slamFx=Math.max(0,P.slamFx-dt);
  P.drop=Math.max(0,P.drop-dt);

  // rain / suppression environment
  P.inRain = (game.stage.theme==='city'||game.stage.theme==='rail') && !solidAt(P.x+P.w/2,P.y-40) && !solidAt(P.x+P.w/2,P.y-140);
  P.suppressed=false;
  for(const e of game.ents){
    if((e.type==='null'||(e.type==='boss'&&game.bossActive)) && !e.deadFx){
      const r=e.type==='boss'?0:150;
      if(r&&dist2(P.x+P.w/2,P.y+P.h/2,e.x+e.w/2,e.y+e.h/2)<r*r) P.suppressed=true;
    }
  }
  // charge & rot
  const flicker=P.rot>=80;
  if(P.suppressed) P.charge=Math.max(0,P.charge-12*dt);
  else P.charge=Math.min(100,P.charge+(flicker?6:13)*dt);
  let decay=0.8; if(P.inRain) decay=2.0;
  P.rot=Math.max(0,P.rot-decay*dt);
  if(P.rot>=100){
    P.rot=60; P.lock=3.5; damagePlayer(12,0,'REDLINE CASCADE'); Snd.sfx('cascade');
    game.cam.shake=Math.max(game.cam.shake,14);
    burst(P.x+P.w/2,P.y+P.h/2,22,COL.rot,240);
  }

  // dash state
  if(P.dashT>0){
    P.dashT-=dt; P.vy=0;
    P.vx=P.dir*880;
    if(Math.random()<0.6) game.parts.push({x:P.x+P.w/2,y:P.y+P.h/2,vx:-P.dir*60,vy:rnd(-20,20),t:0,life:0.25,col:COL.wind,size:rnd(2,5)});
  } else {
    // horizontal
    const acc=P.onG?2400:1500, dec=P.onG?2800:400, top=330;
    if(Input.l&&!Input.r){ P.vx=Math.max(P.vx-acc*dt,-top); P.dir=-1; }
    else if(Input.r&&!Input.l){ P.vx=Math.min(P.vx+acc*dt,top); P.dir=1; }
    else { if(P.vx>0)P.vx=Math.max(0,P.vx-dec*dt); else P.vx=Math.min(0,P.vx+dec*dt); }
    // gravity
    P.vy=Math.min(P.vy+2100*dt,980);
    // jump
    if(Input.pop(' ')||Input.pop('w')||Input.pop('arrowup')||Input.pop('touchjump')) P.jbuf=0.12;
    else P.jbuf=Math.max(0,P.jbuf-dt);
    if(P.onG)P.coyote=0.1; else P.coyote=Math.max(0,P.coyote-dt);
    if(P.jbuf>0&&P.coyote>0){
      if(Input.down){ P.drop=0.22; }
      else { P.vy=-720; P.coyote=0; P.jbuf=0; Snd.sfx('jump'); }
    }
    if(P.vy<0&&!Input.up) P.vy+=1600*dt; // variable jump
  }
  moveBody(P,dt);
  if(P.onG) P.anim+=Math.abs(P.vx)*dt*0.05; else P.anim+=dt*2;

  run.maxX=Math.max(run.maxX,P.x);

  // abilities
  if(P.lock<=0){
    // dash
    if((Input.pop('k')||Input.pop('x')||Input.pop('shift')||(Input.dash&&P.dashCd<=0))&&run.un.dash&&P.dashCd<=0&&P.charge>=8){
      P.dashT=0.17; P.dashCd=0.85; P.inv=Math.max(P.inv,0.22);
      P.charge-=8; P.rot=Math.min(100,P.rot+1); Snd.sfx('dash');
    }
    // heal
    if((Input.pop('l')||Input.pop('c')||Input.pop('h')||Input.heal)&&P.hp<100&&P.charge>=30&&P.healFx<=0){
      Input.heal=false;
      P.charge-=30; P.hp=Math.min(100,P.hp+34); P.rot=Math.min(100,P.rot+4);
      P.healFx=0.6; Snd.sfx('heal');
      burst(P.x+P.w/2,P.y+P.h/2,10,COL.blood,120);
    }
    // spectrum switch
    if(Input.pop('q')){ cycleSpec(-1); }
    if(Input.pop('e')){ cycleSpec(1); }
    for(let i=0;i<4;i++) if(Input.pop(String(i+1))&&run.un[SPEC_ORDER[i]]) run.spec=i;
    // action
    if((Input.pop('j')||Input.pop('z')||Input.pop('touchact')||Input.act)&&P.atkCd<=0){
      doAction();
    }
  }
  // hazards on tiles
  const cx=P.x+P.w/2;
  const feetC=gget(game.grid,Math.floor(cx/TILE),Math.floor((P.y+P.h-4)/TILE));
  const midC=gget(game.grid,Math.floor(cx/TILE),Math.floor((P.y+P.h/2)/TILE));
  if(feetC===SPIKE||midC===SPIKE){ damagePlayer(15,-P.dir); P.vy=-450; }
  if(feetC===LIQ||midC===LIQ){ damagePlayer(12,-P.dir); P.vy=-520; }
  // fell out of world
  if(P.y>game.stage.H*TILE+80) killPlayer();
  // arena clamp
  if(game.bossActive){
    P.x=clamp(P.x,game.arenaL,game.arenaR-P.w);
  }
}
function cycleSpec(d){
  for(let i=0;i<4;i++){
    run.spec=(run.spec+d+4)%4;
    if(run.un[SPEC_ORDER[run.spec]]) return;
  }
}
function doAction(){
  const P=player, key=SPEC_ORDER[run.spec];
  if(!run.un[key]) return;
  const sp=SPECTRA[key];
  if(P.charge<sp.cost) { Snd.tone(140,0.08,'square',0.06); return; }
  if(key==='earth'&&!P.onG) return;
  P.charge-=sp.cost; P.rot=Math.min(100,P.rot+sp.rot); P.atkCd=sp.cd;
  const cx=P.x+P.w/2, cy=P.y+14;
  if(key==='volt'||key==='ice'){
    // aim assist
    let vx=P.dir*(key==='volt'?820:540), vy=0;
    let best=null,bd=420*420;
    for(const e of game.ents){
      if(!isEnemy(e)||e.deadFx) continue;
      const ex=e.x+e.w/2,ey=e.y+e.h/2;
      if((ex-cx)*P.dir<10) continue;
      const d=dist2(cx,cy,ex,ey);
      if(d<bd){bd=d;best=e;}
    }
    if(best){
      const ex=best.x+best.w/2,ey=best.y+best.h/2;
      const d=Math.sqrt(bd)||1, s=(key==='volt'?820:540);
      vx=(ex-cx)/d*s; vy=(ey-cy)/d*s;
    }
    game.projs.push({x:cx+P.dir*14,y:cy,vx,vy,r:key==='volt'?5:6,dmg:key==='volt'?12:6,from:'p',kind:key,t:0,life:0.8});
    Snd.sfx(key);
  } else if(key==='fire'){
    game.fx.push({kind:'cone',x:cx,y:cy,dir:P.dir,t:0,life:0.3,tick:0});
    Snd.sfx('fire');
  } else if(key==='earth'){
    P.slamFx=0.4; game.cam.shake=Math.max(game.cam.shake,10); Snd.sfx('slam');
    const fx=P.x+P.w/2, fy=P.y+P.h;
    burst(fx,fy,18,SPECTRA.earth.col,260,0.5);
    for(const e of game.ents){
      if(!isEnemy(e)||e.deadFx) continue;
      if(dist2(fx,fy,e.x+e.w/2,e.y+e.h/2)<135*135){
        hurtEnemy(e,30); e.stun=Math.max(e.stun||0,e.type==='boss'?0.6:1.4);
        if(e.vy!==undefined) e.vy=-260;
      }
    }
    // break cracks
    const tx=Math.floor(fx/TILE),ty=Math.floor(fy/TILE);
    for(let y=ty-2;y<=ty+3;y++)for(let x=tx-4;x<=tx+4;x++){
      if(gget(game.grid,x,y)===CRACK){
        gset(game.grid,x,y,EMPTY);
        burst(x*TILE+16,y*TILE+16,8,SPECTRA.earth.col,200,0.4);
      }
    }
  }
}
function damagePlayer(d,kdir,label){
  const P=player;
  if(P.inv>0||P.dead) return;
  if(P.rot>=80) d=Math.round(d*1.25);
  P.hp-=d; P.inv=1.0; game.cam.shake=Math.max(game.cam.shake,6);
  if(kdir) { P.vx=kdir*300; P.vy=Math.min(P.vy,-260); }
  Snd.sfx('hurt');
  burst(P.x+P.w/2,P.y+P.h/2,8,'#ff8866',180);
  if(P.hp<=0) killPlayer();
}
function killPlayer(){
  const P=player;
  if(P.dead) return;
  P.dead=true; P.deadT=1.4; run.deaths++;
  Snd.sfx('die'); game.cam.shake=12;
  burst(P.x+P.w/2,P.y+P.h/2,30,COL.charge,320,1);
  burst(P.x+P.w/2,P.y+P.h/2,20,COL.rot,260,1);
}

// ------------------------------------------------------------------ enemies & entities
function isEnemy(e){ return ['drone','guard','null','turret','boss'].includes(e.type); }
function hurtEnemy(e,d){
  if(e.deadFx) return;
  e.hp-=d; e.flash=0.12; Snd.sfx('hit');
  const f=e.idx>=0?game.flags[e.idx]:null;
  if(f) f.hp=e.hp;
  burst(e.x+e.w/2,e.y+e.h/2,5,'#ffffff',160,0.3);
  if(e.hp<=0){
    e.deadFx=0.01; if(f) f.dead=true; run.kills++; run.score+=e.type==='boss'?2500:(e.type==='null'?150:(e.type==='turret'?120:80));
    Snd.sfx('boom');
    burst(e.x+e.w/2,e.y+e.h/2,e.type==='boss'?60:16,'#ffb066',e.type==='boss'?420:260,0.8);
    if(e.type!=='boss'&&Math.random()<0.55)
      game.ents.push({type:'cell',idx:-1,props:{small:1},x:e.x+e.w/2,y:e.y+e.h/2,t:0,respT:0});
    if(e.type==='boss') onBossDead();
  }
}
function updateEnts(dt){
  const P=player;
  for(const e of game.ents){
    e.t+=dt;
    if(e.deadFx!==undefined){ e.deadFx+=dt; continue; }
    if(e.flash) e.flash=Math.max(0,e.flash-dt);
    if(e.frozen>0){ e.frozen-=dt; if(e.type!=='boss') continue; }
    if(e.stun>0){ e.stun-=dt; continue; }
    switch(e.type){
      case 'drone': updateDrone(e,dt); break;
      case 'guard': updateGuard(e,dt); break;
      case 'null': updateNull(e,dt); break;
      case 'turret': updateTurret(e,dt); break;
      case 'boss': if(game.bossActive) updateBoss(e,dt); break;
      case 'vent': updateVent(e,dt); break;
      case 'check':
        if(!e.on&&Math.abs(P.x-e.x)<26&&Math.abs(P.y+P.h-e.y)<60&&!P.dead){
          e.on=true; game.flags[e.idx].on=true;
          P.hp=100; P.charge=100; P.rot=Math.max(0,P.rot-40);
          takeSnapshot(); Snd.sfx('check');
          say([['SYSTEM','GROUNDING CIRCLE — pattern stabilized. Checkpoint locked.']]);
        }
        break;
      case 'exit':
        if(Math.abs(P.x+P.w/2-e.x)<24&&Math.abs(P.y+P.h-e.y)<50&&!P.dead){
          nextStage();
        }
        break;
      case 'trigger': updateTrigger(e); break;
      case 'cell': case 'med': case 'rep': case 'shard': updatePickup(e,dt); break;
    }
    // contact damage
    if(isEnemy(e)&&!e.deadFx&&e.frozen<=0){
      if(rectOverlap(P.x,P.y,P.w,P.h,e.x,e.y,e.w,e.h)){
        const dmg=e.type==='null'?18:(e.type==='boss'?20:(e.type==='guard'?12:10));
        damagePlayer(dmg,P.x+P.w/2<e.x+e.w/2?-1:1);
      }
    }
  }
  game.ents=game.ents.filter(e=>e.deadFx===undefined||e.deadFx<0.6);
}
function rectOverlap(ax,ay,aw,ah,bx,by,bw,bh){
  return ax<bx+bw&&ax+aw>bx&&ay<by+bh&&ay+ah>by;
}
function updateDrone(e,dt){
  const P=player;
  const px=P.x+P.w/2,py=P.y+P.h/2;
  const cx=e.x+e.w/2,cy=e.y+e.h/2;
  const d=dist2(cx,cy,px,py);
  if(!e.props.docile&&d<300*300&&!P.dead){
    const tx=px-e.w/2, ty=py-90-e.h/2;
    e.x+=clamp(tx-e.x,-90*dt,90*dt);
    e.y+=clamp(ty-e.y,-70*dt,70*dt);
    e.fireT-=dt;
    if(e.fireT<=0&&d<260*260){
      e.fireT=1.8;
      const dd=Math.sqrt(d)||1;
      game.projs.push({x:cx,y:cy+6,vx:(px-cx)/dd*260,vy:(py-cy)/dd*260,r:5,dmg:10,from:'e',kind:'eplasma',t:0,life:2.4});
      Snd.sfx('eshot');
    }
  } else {
    // patrol around base
    e.x=e.bx+Math.sin(e.t*1.2)*46;
    e.y=e.by+Math.sin(e.t*2.3)*8;
  }
}
function updateGuard(e,dt){
  const P=player;
  const px=P.x+P.w/2;
  const sees=!P.dead&&Math.abs(P.y-e.y)<80&&Math.abs(px-(e.x+e.w/2))<400;
  if(sees){ e.dir=px<e.x?-1:1; e.alert=2; }
  e.alert=Math.max(0,e.alert-dt);
  if(e.alert>0){
    e.vx=0;
    e.fireT-=dt;
    if(e.fireT<=0){
      if(e.burst===undefined)e.burst=0;
      e.burst++;
      game.projs.push({x:e.x+e.w/2+e.dir*16,y:e.y+14,vx:e.dir*430,vy:0,r:3,dmg:10,from:'e',kind:'ebullet',t:0,life:1.2});
      Snd.sfx('eshot');
      if(e.burst>=3){ e.burst=0; e.fireT=1.6; } else e.fireT=0.14;
    }
  } else {
    e.vx=e.dir*60;
    const min=e.props.min?e.props.min*TILE:null, max=e.props.max?e.props.max*TILE:null;
    if(min!==null&&e.x<min){e.dir=1;} if(max!==null&&e.x+e.w>max*1+TILE){e.dir=-1;}
    if(!groundAhead(e)||e.hitWall) e.dir*=-1;
  }
  e.vy=Math.min((e.vy||0)+2100*dt,980);
  e.vx=e.alert>0?0:e.dir*60;
  moveBody(e,dt);
}
function updateNull(e,dt){
  const P=player;
  e.pulse+=dt;
  const px=P.x+P.w/2;
  if(!P.dead&&Math.abs(px-(e.x+e.w/2))<340&&Math.abs(P.y-e.y)<100) e.dir=px<e.x?-1:1;
  e.vx=e.dir*42;
  if(!groundAhead(e)||e.hitWall) e.dir*=-1;
  e.vy=Math.min((e.vy||0)+2100*dt,980);
  moveBody(e,dt);
}
function updateTurret(e,dt){
  const P=player;
  const px=P.x+P.w/2,py=P.y+P.h/2;
  const cx=e.x+e.w/2,cy=e.y+e.h/2;
  const d=dist2(cx,cy,px,py);
  e.ang=Math.atan2(py-cy,px-cx);
  if(d<480*480&&!P.dead){
    e.fireT-=dt;
    if(e.fireT<=0.5&&e.fireT>0) e.tel=1; else e.tel=0;
    if(e.fireT<=0){
      e.fireT=2.2;
      const dd=Math.sqrt(d)||1;
      game.projs.push({x:cx,y:cy,vx:(px-cx)/dd*310,vy:(py-cy)/dd*310,r:5,dmg:14,from:'e',kind:'eplasma',t:0,life:2.2});
      Snd.sfx('eshot');
    }
  } else e.fireT=Math.max(e.fireT,1);
}
function updateVent(e,dt){
  // cycle: 1.4 warm, 1.1 firing, 1.6 off
  if(e.frozen>0){ e.frozen-=dt; return; }
  const cyc=(e.t+e.phase*1.3)%4.1;
  e.firing = cyc>1.4&&cyc<2.5;
  e.warm = cyc>0.9&&cyc<=1.4;
  if(e.firing&&!player.dead){
    const fx=e.x,fy=e.y*1-64;
    if(rectOverlap(player.x,player.y,player.w,player.h,e.x+4,e.y-64,24,64)) damagePlayer(12,player.dir*-1);
    if(Math.random()<0.5) game.parts.push({x:e.x+16+rnd(-6,6),y:e.y,vx:rnd(-15,15),vy:rnd(-260,-180),t:0,life:0.3,col:'#ffb066',size:rnd(2,5)});
  }
}
function updateTrigger(e){
  const P=player;
  if(e.done||P.dead) return;
  if(P.x+P.w/2>e.x1&&P.x+P.w/2<e.x2){
    e.done=true; game.flags[e.idx].done=true;
    const p=e.props;
    if(p.lines) say(p.lines);
    if(p.door!==undefined) openDoor(p.door);
    if(p.unlock){
      run.un[p.unlock]=true;
      if(SPEC_ORDER.includes(p.unlock)) run.spec=SPEC_ORDER.indexOf(p.unlock);
      const nm=p.unlock==='dash'?'WIND — DASH':SPECTRA[p.unlock]?SPECTRA[p.unlock].name:p.unlock;
      game.banner='SPECTRUM SYNCED — '+nm; game.bannerT=2.6; Snd.sfx('unlock');
    }
    if(p.boss) startBoss();
    if(p.end) startEnding();
  }
}
function openDoor(id){
  for(const e of game.ents){
    if(e.type==='door'&&e.props.id===id&&!e.open){
      e.open=true; game.flags[e.idx].open=true;
      for(let i=0;i<e.props.h;i++) gset(game.grid,e.tx,e.ty+i,EMPTY);
      Snd.sfx('door');
      burst(e.x+16,e.y+e.props.h*16,12,'#88ffcc',160,0.5);
    }
  }
}
function updatePickup(e,dt){
  const P=player;
  if(e.respT>0){ e.respT-=dt; return; }
  e.bob=Math.sin(e.t*3)*4;
  if(!P.dead&&rectOverlap(P.x,P.y,P.w,P.h,e.x-12,e.y-12+e.bob,24,24)){
    let took=true;
    if(e.type==='cell'){ P.charge=Math.min(100,P.charge+(e.props.small?12:35)); Snd.sfx('pick'); }
    else if(e.type==='med'){ if(P.hp>=100){took=false;} else {P.hp=Math.min(100,P.hp+30); Snd.sfx('pick');} }
    else if(e.type==='rep'){ P.rot=Math.max(0,P.rot-35); Snd.sfx('pick'); say([['ELIK','Reprieve dose. Field-grade, no authentication lock. The Rot backs off — for now.']]); }
    else if(e.type==='shard'){
      run.shards++; run.score+=500; Snd.sfx('shard');
      game.lorePopup=SHARD_LORE[e.props.lore||0]; game.loreT=6;
    }
    if(took){
      if(e.props&&e.props.respawn){ e.respT=e.props.respawn; }
      else{
        e.deadFx=999;
        if(e.idx>=0) game.flags[e.idx].taken=true;
      }
    }
  }
}

// ------------------------------------------------------------------ boss
function startBoss(){
  const b=game.ents.find(e=>e.type==='boss');
  if(!b||game.bossActive||game.flags[b.idx].dead) return;
  game.bossActive=true; game.boss=b;
  game.arenaL=142*TILE; game.arenaR=177*TILE;
  b.st='enter'; b.stT=0;
  Snd.sfx('roar'); game.cam.shake=10;
  say([['WARDEN','SUBJECT CBE-03. YOU ARE EXPERIENCING A MEDICAL EMERGENCY. REMAIN CALM. CUSTODY IS CARE.'],
       ['VIN','No. Custody is custody.']]);
}
function updateBoss(e,dt){
  const P=player;
  e.stT+=dt;
  e.vy=Math.min((e.vy||0)+2100*dt,980);
  const frac=e.hp/e.maxhp;
  e.phase = frac>0.66?1:(frac>0.33?2:3);
  const speedMul = e.frozen>0?0.35:1;
  const px=P.x+P.w/2, ex=e.x+e.w/2;
  switch(e.st){
    case 'enter':
      if(e.stT>1){ e.st='walk'; e.stT=0; }
      break;
    case 'walk': {
      e.dir=px<ex?-1:1;
      e.vx=e.dir*95*speedMul*(e.phase===3?1.35:1);
      if(e.stT>1.2){
        e.stT=0;
        const close=Math.abs(px-ex)<130;
        if(close&&P.onG){ e.st='stompTel'; }
        else {
          const r=Math.random();
          if(e.phase>=2&&r<0.35){ e.st='dashTel'; }
          else if(e.phase>=3&&r<0.65){ e.st='missile'; }
          else e.st='shoot';
        }
        e.vx=0;
      }
      break; }
    case 'stompTel':
      e.vx=0;
      if(e.stT>0.45){
        e.st='walk'; e.stT=0;
        Snd.sfx('slam'); game.cam.shake=12;
        const fy=e.y+e.h;
        game.projs.push({x:ex-40,y:fy-14,vx:-300,vy:0,r:14,dmg:15,from:'e',kind:'shock',t:0,life:2});
        game.projs.push({x:ex+40,y:fy-14,vx:300,vy:0,r:14,dmg:15,from:'e',kind:'shock',t:0,life:2});
        burst(ex,fy,16,SPECTRA.earth.col,300,0.6);
      }
      break;
    case 'dashTel':
      e.vx=0; e.dir=px<ex?-1:1;
      if(e.stT>0.55){
        e.st='dash'; e.stT=0; Snd.sfx('roar');
      }
      break;
    case 'dash':
      e.vx=e.dir*640*speedMul;
      if(e.stT>0.75||e.hitWall){ e.st='walk'; e.stT=0; e.vx=0; }
      break;
    case 'shoot': {
      e.vx=0;
      const n=e.phase>=2?4:3;
      if(!e.shots){ e.shots=0; }
      if(e.stT>0.25+e.shots*0.22&&e.shots<n){
        e.shots++;
        const dy=(P.y+P.h/2)-(e.y+30);
        const dx=px-ex;
        const dd=Math.sqrt(dx*dx+dy*dy)||1;
        game.projs.push({x:ex+e.dir*30,y:e.y+30,vx:dx/dd*340,vy:dy/dd*340,r:6,dmg:15,from:'e',kind:'eplasma',t:0,life:2.2});
        Snd.sfx('eshot');
      }
      if(e.shots>=n&&e.stT>0.4+n*0.22){ e.shots=0; e.st='walk'; e.stT=0; }
      break; }
    case 'missile': {
      e.vx=0;
      if(!e.mfired&&e.stT>0.4){
        e.mfired=true;
        for(let i=0;i<5;i++){
          const tx=clamp(px+rnd(-140,140),game.arenaL+30,game.arenaR-30);
          const t=1.15, y0=e.y+10, yg=e.y+e.h;
          const vx0=(tx-ex)/t, vy0=(yg-y0-0.5*1400*t*t)/t;
          game.projs.push({x:ex,y:y0,vx:vx0,vy:vy0,r:6,dmg:20,from:'e',kind:'missile',grav:1400,t:0,life:3,mark:tx,markY:yg});
        }
        Snd.sfx('fire');
      }
      if(e.stT>1.1){ e.mfired=false; e.st='walk'; e.stT=0; }
      break; }
  }
  // drone reinforcement in phase 3
  if(e.phase>=3){
    e.spawnT-=dt;
    const alive=game.ents.filter(x=>x.type==='drone'&&!x.deadFx).length;
    if(e.spawnT<=0&&alive<2){
      e.spawnT=7;
      const d={type:'drone',idx:-1,props:{},x:e.x+e.w/2,y:e.y-30,w:30,h:22,hp:25,dir:1,fireT:1,frozen:0,stun:0,t:0,bx:e.x,by:e.y-40};
      game.ents.push(d);
      burst(d.x,d.y,8,'#ffb066',180,0.4);
    }
  }
  moveBody(e,dt);
  e.x=clamp(e.x,game.arenaL,game.arenaR-e.w);
}
function onBossDead(){
  game.bossActive=false;
  game.cam.shake=16;
  openDoor(1);
  say([
    ['TOMAS','Down. Stay down.'],
    ['ELIK','Vin — your hands are shaking. That\'s fine. That\'s allowed. Walk.'],
    ['VIN','The rail\'s just ahead. We\'re almost—  we\'re almost.'],
  ]);
  run.score+=1000;
}

// ------------------------------------------------------------------ projectiles / fx
function updateProjs(dt){
  const P=player;
  for(const p of game.projs){
    p.t+=dt;
    if(p.grav) p.vy+=p.grav*dt;
    p.x+=p.vx*dt; p.y+=p.vy*dt;
    if(p.t>p.life){ p.dead=true; continue; }
    // tile hit
    const c=gget(game.grid,Math.floor(p.x/TILE),Math.floor(p.y/TILE));
    if(isSolidCode(c)&&p.kind!=='shock'){
      p.dead=true;
      if(p.kind==='missile'){ boomAt(p.x,p.y,46,20); }
      else burst(p.x,p.y,4,p.from==='p'?'#fff':'#ff8866',120,0.25);
      // junction hit by volt
      if(p.kind==='volt'){
        const tx=Math.floor(p.x/TILE),ty=Math.floor(p.y/TILE);
        zapJunctionAt(tx,ty);
      }
      continue;
    }
    if(p.kind==='shock'&&isSolidCode(gget(game.grid,Math.floor((p.x+(p.vx>0?16:-16))/TILE),Math.floor(p.y/TILE)))){ p.dead=true; continue; }
    if(p.from==='p'){
      // junction proximity
      if(p.kind==='volt'){
        for(const e of game.ents){
          if(e.type==='junction'&&!e.on&&dist2(p.x,p.y,e.x+16,e.y+16)<26*26){
            e.on=true; game.flags[e.idx].on=true; openDoor(e.props.door);
            p.dead=true; burst(e.x+16,e.y+16,10,SPECTRA.volt.col,200,0.4);
          }
        }
      }
      if(p.kind==='ice'){
        for(const e of game.ents){
          if(e.type==='vent'&&dist2(p.x,p.y,e.x+16,e.y-20)<40*40){
            e.frozen=6; p.dead=true; burst(e.x+16,e.y-10,10,SPECTRA.ice.col,160,0.4);
          }
        }
      }
      for(const e of game.ents){
        if(!isEnemy(e)||e.deadFx) continue;
        if(p.x>e.x-4&&p.x<e.x+e.w+4&&p.y>e.y-4&&p.y<e.y+e.h+4){
          hurtEnemy(e,p.dmg);
          if(p.kind==='ice') e.frozen=Math.max(e.frozen||0,e.type==='boss'?1.2:2.2);
          p.dead=true; break;
        }
      }
    } else {
      if(!P.dead&&P.inv<=0&&p.x>P.x-2&&p.x<P.x+P.w+2&&p.y>P.y-2&&p.y<P.y+P.h+2){
        damagePlayer(p.dmg,p.vx>0?1:-1);
        p.dead=true;
        if(p.kind==='missile') boomAt(p.x,p.y,46,0);
      }
      if(p.kind==='missile'&&p.y>p.markY-4){ p.dead=true; boomAt(p.x,p.y,52,20); }
    }
  }
  game.projs=game.projs.filter(p=>!p.dead);
  // fire cone fx
  for(const f of game.fx){
    f.t+=dt;
    if(f.kind==='cone'){
      f.x=player.x+player.w/2; f.y=player.y+14; f.dir=player.dir;
      if(f.t>f.tick*0.1){
        f.tick++;
        const rx=f.dir>0?f.x:f.x-120, ry=f.y-34, rw=120, rh=68;
        for(const e of game.ents){
          if(isEnemy(e)&&!e.deadFx&&rectOverlap(rx,ry,rw,rh,e.x,e.y,e.w,e.h)) hurtEnemy(e,7);
          if(e.type==='barr'&&e.hp>0){
            const bx=e.x,by=e.y,bw=TILE,bh=(e.props.h||3)*TILE;
            if(rectOverlap(rx,ry,rw,rh,bx,by,bw,bh)){
              e.hp--; game.flags[e.idx].hp=e.hp; e.flash=0.1;
              burst(bx+16,by+bh/2,8,'#ffb066',200,0.4);
              if(e.hp<=0){
                game.flags[e.idx].dead=true; e.deadFx=0.01;
                for(let i=0;i<(e.props.h||3);i++) gset(game.grid,e.tx,e.ty+i,EMPTY);
                Snd.sfx('boom'); run.score+=50;
              }
            }
          }
        }
        for(let i=0;i<6;i++)
          game.parts.push({x:f.x+f.dir*rnd(10,110),y:f.y+rnd(-26,26),vx:f.dir*rnd(60,200),vy:rnd(-60,20),t:0,life:rnd(0.2,0.4),col:Math.random()<0.5?'#ff6a3d':'#ffd94a',size:rnd(3,7)});
      }
    }
  }
  game.fx=game.fx.filter(f=>f.t<f.life);
}
function zapJunctionAt(tx,ty){
  for(const e of game.ents){
    if(e.type==='junction'&&!e.on&&Math.abs(e.tx-tx)<=1&&Math.abs(e.ty-ty)<=1){
      e.on=true; game.flags[e.idx].on=true; openDoor(e.props.door);
      burst(e.x+16,e.y+16,10,SPECTRA.volt.col,200,0.4);
    }
  }
}
function boomAt(x,y,r,dmg){
  burst(x,y,14,'#ffb066',260,0.5);
  game.cam.shake=Math.max(game.cam.shake,5);
  Snd.sfx('boom');
  const P=player;
  if(dmg&&!P.dead&&P.inv<=0&&dist2(x,y,P.x+P.w/2,P.y+P.h/2)<r*r) damagePlayer(dmg,P.x<x?-1:1);
}
function burst(x,y,n,col,sp,life){
  for(let i=0;i<n;i++){
    const a=rnd(0,Math.PI*2),s=rnd(sp*0.3,sp);
    game.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-60,t:0,life:rnd(0.25,(life||0.5)),col,size:rnd(2,5),grav:600});
  }
}
function updateParts(dt){
  for(const p of game.parts){
    p.t+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt;
    if(p.grav)p.vy+=p.grav*dt;
  }
  game.parts=game.parts.filter(p=>p.t<p.life);
  if(game.parts.length>400) game.parts.splice(0,game.parts.length-400);
}

// ------------------------------------------------------------------ dialogue / banners
function say(lines){
  for(const l of lines) game.dlg.push(l);
}
function updateDlg(dt){
  if(game.dlg.length===0) return;
  if(game.dlgT<=0){
    const cur=game.dlg[0];
    game.dlgT=Math.max(2.3,cur[1].length*0.05);
  }
  game.dlgT-=dt;
  if(Input.pop('enter')) game.dlgT=0;
  if(game.dlgT<=0){ game.dlg.shift(); }
  else return;
}

// ------------------------------------------------------------------ stage flow
function nextStage(){
  run.score+=1000;

  else startEnding();

function startEnding(){
  game.state='end'; game.endT=0; game.endStep=0;

  // save best
  try{
    const prev=JSON.parse(localStorage.getItem('cr_vinescape_best')||'null');
    if(!prev||run.score>prev.score)
      localStorage.setItem('cr_vinescape_best',JSON.stringify({score:run.score,time:run.time,shards:run.shards}));
  }catch(e){}

}
function resetRun(){

// ------------------------------------------------------------------ parallax / theme
const THEMES={
  lab: { sky:['#07070f','#0b0d1a'], accent:'#3ce0ff', accent2:'#ff3d7a', tile:'#151626', edge:'#2b2d4d', deco:'#1b1d33' },
  grid: { sky:['#060a08','#0a1410'], accent:'#2fbf71', accent2:'#ffd94a', tile:'#121a16', edge:'#24402f', deco:'#16221b' },
  city: { sky:['#0a0716','#171030'], accent:'#ff2fa0', accent2:'#3ce0ff', tile:'#16121f', edge:'#33224d', deco:'#201735' },
  rail: { sky:['#0f0708','#1d0f12'], accent:'#ff6a3d', accent2:'#9fe8ff', tile:'#1a1214', edge:'#3d2326', deco:'#241619' },
};
let paraFar=null, paraNear=null;
function buildParallax(theme){
  const T=THEMES[theme];
  paraFar=document.createElement('canvas'); paraFar.width=1600; paraFar.height=VH;
  paraNear=document.createElement('canvas'); paraNear.width=1600; paraNear.height=VH;
  const f=paraFar.getContext('2d'), n=paraNear.getContext('2d');
  if(theme==='lab'||theme==='grid'){
    // interior: panels + pipes/tanks
    f.fillStyle='rgba(255,255,255,0.02)';
    for(let x=0;x<1600;x+=80){ f.fillRect(x,0,1,VH); }
    for(let y=0;y<VH;y+=64){ f.fillRect(0,y,1600,1); }
    for(let i=0;i<26;i++){
      const x=rnd(0,1560),y=rnd(60,VH-120),w=rnd(30,90),h=rnd(60,180);
      f.fillStyle='rgba(255,255,255,0.025)'; f.fillRect(x,y,w,h);
      f.fillStyle=theme==='grid'?'rgba(47,191,113,0.10)':'rgba(60,224,255,0.08)';
      f.fillRect(x+w*0.2,y+8,w*0.6,3);
    }
    n.strokeStyle='rgba(255,255,255,0.05)'; n.lineWidth=6;
    for(let i=0;i<10;i++){
      const y=rnd(20,140); n.beginPath(); n.moveTo(rnd(0,300)*i%1600,y); n.lineTo((rnd(0,300)*i%1600)+rnd(200,500),y); n.stroke();
    }
    for(let i=0;i<16;i++){
      const x=rnd(0,1570); const h=rnd(80,220);
      n.fillStyle='rgba(0,0,0,0.35)'; n.fillRect(x,VH-h,rnd(24,60),h);
      n.fillStyle=theme==='grid'?'rgba(47,191,113,0.25)':'rgba(60,224,255,0.2)';
      if(Math.random()<0.7) n.fillRect(x+6,VH-h+10,4,4);
    }
  } else {
    // skyline
    for(let x=0;x<1600;){
      const w=irnd(40,110), h=irnd(90,theme==='city'?300:200);
      f.fillStyle=theme==='city'?'rgba(24,16,44,0.9)':'rgba(30,16,18,0.9)';
      f.fillRect(x,VH-h,w,h);
      // windows
      for(let wy=VH-h+8;wy<VH-12;wy+=14) for(let wx=x+5;wx<x+w-6;wx+=12){
        if(Math.random()<(theme==='city'?0.16:0.05)){
          f.fillStyle=Math.random()<0.5?(theme==='city'?'rgba(255,47,160,0.5)':'rgba(255,106,61,0.5)'):'rgba(120,220,255,0.45)';
          f.fillRect(wx,wy,4,6);
        }
      }
      x+=w+irnd(6,30);
    }
    for(let x=0;x<1600;){
      const w=irnd(60,150), h=irnd(160,theme==='city'?380:260);
      n.fillStyle=theme==='city'?'rgba(12,8,26,0.95)':'rgba(16,9,10,0.95)';
      n.fillRect(x,VH-h,w,h);
      n.fillStyle=theme==='city'?'rgba(60,224,255,0.5)':'rgba(159,232,255,0.3)';
      if(Math.random()<0.6) n.fillRect(x,VH-h,w,2);
      for(let wy=VH-h+10;wy<VH-16;wy+=18) for(let wx=x+6;wx<x+w-8;wx+=14){
        if(Math.random()<(theme==='city'?0.11:0.04)){
          n.fillStyle=Math.random()<0.4?'rgba(255,217,74,0.5)':'rgba(120,200,255,0.35)';
          n.fillRect(wx,wy,5,7);
        }
      }
      x+=w+irnd(10,50);
    }
  }
}
let scanCanvas=null;
function getScan(){

  scanCanvas=document.createElement('canvas'); scanCanvas.width=8; scanCanvas.height=4;
  const c=scanCanvas.getContext('2d');
  c.fillStyle='rgba(0,0,0,0.10)'; c.fillRect(0,2,8,1);

// rain particles (screen-space)
const rain=[];
for(let i=0;i<120;i++) rain.push({x:Math.random()*VW,y:Math.random()*VH,s:rnd(400,700),l:rnd(8,18)});

// ------------------------------------------------------------------ render
function render(dt){
  const T=THEMES[game.stage?game.stage.theme:'city'];
  const g=ctx;
  // bg
  const grad=g.createLinearGradient(0,0,0,VH);
  grad.addColorStop(0,T.sky[0]); grad.addColorStop(1,T.sky[1]);
  g.fillStyle=grad; g.fillRect(0,0,VW,VH);

  if(game.state==='title'){ renderTitle(g); return; }
  if(game.state==='end'){ renderEnd(g); return; }

  const cam=game.cam;
  let sx=0,sy=0;
  if(cam.shake>0){ sx=rnd(-cam.shake,cam.shake); sy=rnd(-cam.shake,cam.shake); }

  // storm flash (city)
  if(game.stage.theme==='city'&&Math.random()<0.006){
    g.fillStyle='rgba(160,190,255,0.12)'; g.fillRect(0,0,VW,VH);
  }
  // parallax
  if(paraFar){
    const ox=-(cam.x*0.2)%1600;
    g.drawImage(paraFar,ox,0); g.drawImage(paraFar,ox+1600,0);
    const ox2=-(cam.x*0.45)%1600;
    g.drawImage(paraNear,ox2,0); g.drawImage(paraNear,ox2+1600,0);
  }

  g.save();
  g.translate(-cam.x+sx,-cam.y+sy);
  renderTiles(g);
  renderEnts(g);
  if(!player.dead) renderPlayer(g);
  renderProjs(g);
  // particles
  for(const p of game.parts){
    g.globalAlpha=1-p.t/p.life;
    g.fillStyle=p.col;
    g.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);
  }
  g.globalAlpha=1;
  g.restore();

  // rain overlay
  if(game.stage.theme==='city'||game.stage.theme==='rail'){
    g.strokeStyle=game.stage.theme==='city'?'rgba(140,190,255,0.25)':'rgba(140,190,255,0.12)';
    g.lineWidth=1;
    g.beginPath();
    for(const r of rain){
      r.y+=r.s*dt; r.x-=r.s*0.12*dt;
      if(r.y>VH){ r.y=-20; r.x=Math.random()*(VW+80); }
      g.moveTo(r.x,r.y); g.lineTo(r.x-r.l*0.12,r.y+r.l);
    }
    g.stroke();
  }
  // scanlines + vignette
  g.fillStyle=g.createPattern(getScan(),'repeat');
  g.fillRect(0,0,VW,VH);
  const vg=g.createRadialGradient(VW/2,VH/2,VH*0.45,VW/2,VH/2,VH*0.85);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,0.45)');
  g.fillStyle=vg; g.fillRect(0,0,VW,VH);

  // rot glitch
  if(player.rot>=80&&Math.random()<0.35){
    const y=irnd(0,VH-20),h=irnd(3,14),off=irnd(-24,24);
    g.drawImage(canvas,0,y,VW,h,off,y,VW,h);
    g.fillStyle='rgba(255,47,160,0.06)'; g.fillRect(0,0,VW,VH);
  }
  if(player.suppressed){
    g.fillStyle='rgba(90,106,138,0.10)'; g.fillRect(0,0,VW,VH);
  }

  renderHUD(g);
  renderDlg(g);

  if(game.state==='card') renderCard(g);
  if(game.state==='pause') renderPause(g);
}

function renderTiles(g){
  const T=THEMES[game.stage.theme];
  const cam=game.cam, gr=game.grid;
  const x0=Math.max(0,Math.floor(cam.x/TILE)-1), x1=Math.min(gr.w-1,Math.ceil((cam.x+VW)/TILE)+1);
  const y0=Math.max(0,Math.floor(cam.y/TILE)-1), y1=Math.min(gr.h-1,Math.ceil((cam.y+VH)/TILE)+1);
  const t=performance.now()/1000;
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
    const c=gr.c[y*gr.w+x];
    if(!c) continue;
    const px=x*TILE,py=y*TILE;
    if(c===SOLID||c===CRACK){
      g.fillStyle=T.tile; g.fillRect(px,py,TILE,TILE);
      if(gget(gr,x,y-1)!==SOLID&&gget(gr,x,y-1)!==CRACK){
        g.fillStyle=T.edge; g.fillRect(px,py,TILE,3);
        g.fillStyle=T.accent+'55'; g.fillRect(px,py,TILE,1);
      }
      if((x*7+y*13)%11===0){ g.fillStyle='rgba(255,255,255,0.02)'; g.fillRect(px+4,py+8,TILE-8,2); }
      if(c===CRACK){
        g.strokeStyle=SPECTRA.earth.col+'cc'; g.lineWidth=1.5;
        g.beginPath();
        g.moveTo(px+6,py+4); g.lineTo(px+16,py+16); g.lineTo(px+10,py+28);
        g.moveTo(px+24,py+2); g.lineTo(px+18,py+14); g.lineTo(px+27,py+27);
        g.stroke();
      }
    } else if(c===PLAT){
      g.fillStyle=T.edge; g.fillRect(px,py+2,TILE,6);
      g.fillStyle=T.accent+'aa'; g.fillRect(px,py+2,TILE,2);
    } else if(c===SPIKE){
      g.fillStyle='#39415e';
      for(let i=0;i<4;i++){
        g.beginPath();
        g.moveTo(px+i*8,py+TILE); g.lineTo(px+i*8+4,py+8+Math.sin(t*4+x)*2); g.lineTo(px+i*8+8,py+TILE);
        g.fill();
      }
      g.fillStyle='#8fa3d955'; g.fillRect(px,py+28,TILE,4);
    } else if(c===LIQ){
      g.fillStyle=game.stage.theme==='rail'?'rgba(120,255,140,0.20)':'rgba(60,150,190,0.25)';
      g.fillRect(px,py+6,TILE,TILE-6);
      g.fillStyle=game.stage.theme==='rail'?'rgba(160,255,170,0.6)':'rgba(120,220,255,0.5)';
      g.fillRect(px,py+6+Math.sin(t*3+x*1.3)*2,TILE,2);
    } else if(c===BARR){
      g.fillStyle='#4a3320'; g.fillRect(px+2,py,TILE-4,TILE);
      g.fillStyle='#775430'; g.fillRect(px+2,py+4,TILE-4,4); g.fillRect(px+2,py+18,TILE-4,4);
      g.fillStyle='#ffb04466'; g.fillRect(px+2,py+10,TILE-4,3);
    } else if(c===DOOR){
      g.fillStyle='#1c2333'; g.fillRect(px+2,py,TILE-4,TILE);
      g.fillStyle=T.accent2; g.fillRect(px+14,py+10,4,12);
      g.fillStyle=(Math.sin(t*6)>0)?'#ff5555':'#803333';
      g.fillRect(px+13,py+4,6,3);
    }
  }
}

function renderPlayer(g){
  const P=player;
  const t=performance.now()/1000;
  if(P.inv>0&&Math.floor(t*14)%2===0&&P.dashT<=0) return;
  const x=P.x,y=P.y,d=P.dir;
  g.save();
  g.translate(x+P.w/2,y);
  // dash afterglow
  if(P.dashT>0){ g.globalAlpha=0.85; }
  // legs
  const moving=Math.abs(P.vx)>20&&P.onG;
  const lp=Math.sin(P.anim*6)*(moving?6:0);
  g.strokeStyle='#141a24'; g.lineWidth=6; g.lineCap='round';
  g.beginPath(); g.moveTo(-3,26); g.lineTo(-3+lp*d,38); g.moveTo(4,26); g.lineTo(4-lp*d,38); g.stroke();
  // body jacket
  g.fillStyle='#10161f'; g.fillRect(-8,10,16,18);
  // confluence hardware glow lines

  g.beginPath(); g.moveTo(-6,13); g.lineTo(6,13); g.moveTo(-6,17); g.lineTo(2,17); g.stroke();
  // spine conduit glows with the selected spectrum
  g.fillStyle=SPECTRA[SPEC_ORDER[runSpecIdx()]].col;
  g.fillRect(d>0?-8:6,12,2,14);
  // arms
  g.strokeStyle='#0e131c'; g.lineWidth=5;

  // head

  // gold curls
  g.fillStyle='#e8c65c';
  g.beginPath(); g.arc(-3,-5,4,0,7); g.arc(2,-6,4,0,7); g.arc(5,-3,3,0,7); g.arc(-6,-2,3,0,7); g.fill();
  // eyes
  g.fillStyle='#dff3ff'; g.fillRect(d>0?1:-4,0,3,2);
  // heal aura
  if(P.healFx>0){
    g.strokeStyle=COL.blood; g.globalAlpha=P.healFx;

  }

    g.lineWidth=3;
    g.beginPath(); g.arc(0,P.h,135*(1-P.slamFx/0.4),0,7); g.stroke(); g.globalAlpha=1;
  }
  g.restore();
}
function runSpecIdx(){ return run.spec; }

function renderEnts(g){
  const t=performance.now()/1000;
  const T=THEMES[game.stage.theme];
  for(const e of game.ents){
    if(e.deadFx!==undefined&&e.type!=='barr'){ continue; }
    switch(e.type){
      case 'drone': {
        g.save(); g.translate(e.x+e.w/2,e.y+e.h/2);

        g.fillStyle=e.flash?'#ffffff':'#232a3d';

        g.moveTo(-15,0); g.lineTo(-7,-10); g.lineTo(7,-10); g.lineTo(15,0); g.lineTo(7,10); g.lineTo(-7,10); g.fill();

        g.fillStyle='#ff3d5e'; g.fillRect(e.dir>0?0:-5,0,5,2); // visor
        g.fillStyle='#39415e'; g.fillRect(e.dir>0?4:-14,12,10,4); // gun

      case 'null': {

        g.fillStyle=e.flash?'#fff':'#3d4560';
        g.fillRect(-13,2,26,30);
        g.fillStyle=e.flash?'#fff':'#2a3048';
        g.fillRect(-10,32,8,14); g.fillRect(3,32,8,14);
        g.fillStyle='#1a2030'; g.fillRect(-8,-8,16,12);
        g.fillStyle='#8fa3d9'; g.fillRect(-6,-4,12,2);
        // coils
        g.strokeStyle='#8fa3d9'; g.lineWidth=2;
        g.beginPath(); g.arc(0,16,16,0.6,2.5); g.stroke();
        g.beginPath(); g.arc(0,20,19,0.8,2.3); g.stroke();
        if(e.frozen>0){ g.strokeStyle=SPECTRA.ice.col; g.strokeRect(-15,-10,30,56); }
        g.restore();
        break; }
      case 'turret': {
        g.save(); g.translate(e.x+e.w/2,e.y+e.h/2);
        g.fillStyle=e.flash?'#fff':'#2a3048';
        g.beginPath(); g.arc(0,0,13,0,7); g.fill();
        g.strokeStyle=e.tel?'#ff5555':'#39415e'; g.lineWidth=5;
        g.beginPath(); g.moveTo(0,0); g.lineTo(Math.cos(e.ang)*16,Math.sin(e.ang)*16); g.stroke();
        g.fillStyle=e.tel?'#ff5555':'#c22a44'; g.fillRect(-3,-3,6,6);
        g.restore();
        break; }
      case 'boss': {
        if(!game.bossActive&&game.flags[e.idx]&&game.flags[e.idx].dead) break;
        g.save(); g.translate(e.x+e.w/2,e.y);
        const tel=e.st==='stompTel'||e.st==='dashTel';
        if(e.frozen>0) g.globalAlpha=0.9;
        // legs
        g.fillStyle='#20263a';
        g.fillRect(-34,64,20,28); g.fillRect(14,64,20,28);
        // torso
        g.fillStyle=e.flash?'#fff':(tel&&Math.floor(t*10)%2?'#5a2a35':'#2a3048');
        g.fillRect(-42,8,84,58);
        g.fillStyle='#d8dde6'; g.fillRect(-42,8,84,8);
        g.fillStyle='#c22a44'; g.fillRect(-42,18,84,4);
        // core
        g.fillStyle=e.phase>=3?'#ff5555':'#ff2fa0';
        g.beginPath(); g.arc(0,40,10+Math.sin(t*5)*2,0,7); g.fill();
        // head
        g.fillStyle='#1a2030'; g.fillRect(-16,-10,32,18);
        g.fillStyle='#ff3d5e'; g.fillRect(e.dir>0?2:-12,-4,10,3);
        // shoulder cannon
        g.fillStyle='#39415e'; g.fillRect(e.dir>0?20:-52,-2,32,10);
        if(e.frozen>0){ g.strokeStyle=SPECTRA.ice.col; g.lineWidth=2; g.strokeRect(-46,-12,92,106); }
        g.restore();
        break; }
      case 'vent': {
        g.fillStyle='#39415e'; g.fillRect(e.x+6,e.y-6,20,8);
        g.fillStyle='#1a2030'; g.fillRect(e.x+10,e.y-10,12,5);
        if(e.frozen>0){
          g.fillStyle=SPECTRA.ice.col+'cc'; g.fillRect(e.x+8,e.y-16,16,10);
          g.fillStyle=SPECTRA.ice.col+'66'; g.fillRect(e.x+10,e.y-22,12,7);
        } else if(e.firing){
          const hh=58+Math.sin(t*30)*6;
          const gr3=g.createLinearGradient(0,e.y,0,e.y-hh);
          gr3.addColorStop(0,'rgba(255,176,102,0.95)'); gr3.addColorStop(1,'rgba(255,80,40,0)');
          g.fillStyle=gr3; g.fillRect(e.x+6,e.y-hh,20,hh);
        } else if(e.warm){
          g.fillStyle='rgba(255,176,102,0.5)'; g.fillRect(e.x+10,e.y-14,12,8);
        }
        break; }
      case 'junction': {
        g.fillStyle='#1a2030'; g.fillRect(e.x+4,e.y+4,24,24);
        g.strokeStyle=e.on?SPECTRA.volt.col:'#39415e'; g.lineWidth=2;
        g.strokeRect(e.x+4,e.y+4,24,24);
        g.fillStyle=e.on?SPECTRA.volt.col:(Math.sin(t*5)>0?'#8fa3d9':'#39415e');
        g.beginPath();
        g.moveTo(e.x+18,e.y+8); g.lineTo(e.x+12,e.y+17); g.lineTo(e.x+16,e.y+17); g.lineTo(e.x+13,e.y+25); g.lineTo(e.x+21,e.y+15); g.lineTo(e.x+17,e.y+15); g.closePath(); g.fill();
        break; }
      case 'cell': {
        const bob=Math.sin(e.t*3)*4;
        if(e.respT>0) break;
        g.fillStyle=COL.charge; g.globalAlpha=0.25;
        g.beginPath(); g.arc(e.x,e.y+bob,e.props.small?8:12,0,7); g.fill(); g.globalAlpha=1;
        g.fillStyle=COL.charge; g.fillRect(e.x-4,e.y-7+bob,8,14);
        g.fillStyle='#dff9ff'; g.fillRect(e.x-4,e.y-7+bob,8,3);
        break; }
      case 'med': {
        if(e.respT>0) break;
        const bob=Math.sin(e.t*3)*4;
        g.fillStyle='#e8f8ee'; g.fillRect(e.x-8,e.y-8+bob,16,16);
        g.fillStyle=COL.hp; g.fillRect(e.x-2,e.y-6+bob,4,12); g.fillRect(e.x-6,e.y-2+bob,12,4);
        break; }
      case 'rep': {
        if(e.respT>0) break;
        const bob=Math.sin(e.t*3)*4;
        g.fillStyle='#2a1030'; g.fillRect(e.x-5,e.y-8+bob,10,16);
        g.fillStyle=COL.rot; g.fillRect(e.x-5,e.y-2+bob,10,7);
        g.fillStyle='#ffd6f0'; g.fillRect(e.x-5,e.y-8+bob,10,3);
        break; }
      case 'shard': {
        const bob=Math.sin(e.t*3)*5;
        g.save(); g.translate(e.x,e.y+bob); g.rotate(e.t*1.5);
        g.fillStyle='rgba(255,217,74,0.25)';
        g.beginPath(); g.arc(0,0,14,0,7); g.fill();
        g.fillStyle='#ffd94a';
        g.fillRect(-5,-8,10,16);
        g.fillStyle='#fff3c0'; g.fillRect(-5,-8,10,4);
        g.restore();
        break; }
      case 'check': {
        const on=e.on, cy2=e.y-22;
        g.strokeStyle=on?COL.hp:'rgba(160,200,255,0.5)'; g.lineWidth=2;
        g.beginPath(); g.arc(e.x,cy2,16+(on?Math.sin(t*3)*2:0),0,7); g.stroke();
        g.beginPath(); g.arc(e.x,cy2,8,0,7); g.stroke();
        g.fillStyle=on?COL.hp:'rgba(160,200,255,0.4)';
        g.beginPath(); g.arc(e.x,cy2,3,0,7); g.fill();
        g.fillStyle=on?COL.hp+'44':'rgba(160,200,255,0.15)';
        g.fillRect(e.x-20,e.y-3,40,3);
        if(on){
          g.globalAlpha=0.3+Math.sin(t*3)*0.15;
          g.strokeStyle=COL.hp;
          g.beginPath(); g.arc(e.x,cy2,24,0,7); g.stroke();
          g.globalAlpha=1;
        }
        break; }
      case 'exit': {
        g.fillStyle='#0e1420'; g.fillRect(e.x-20,e.y-64,40,64);
        g.strokeStyle=T.accent; g.lineWidth=2; g.strokeRect(e.x-20,e.y-64,40,64);
        g.fillStyle=T.accent+'44'; g.fillRect(e.x-16,e.y-60,32,56);
        const ar=Math.sin(t*4)*4;
        g.fillStyle='#dff3ff';
        g.beginPath(); g.moveTo(e.x-8,e.y-36+ar); g.lineTo(e.x+8,e.y-36+ar); g.lineTo(e.x,e.y-24+ar); g.fill();
        break; }
    }
  }
  // barricades draw via tiles; door tiles as well.
}

function renderProjs(g){
  for(const p of game.projs){
    if(p.kind==='volt'){
      g.strokeStyle=SPECTRA.volt.col; g.lineWidth=2.5;
      g.beginPath(); g.moveTo(p.x,p.y);
      const bx=p.x-p.vx*0.02, by=p.y-p.vy*0.02;
      g.lineTo(bx+rnd(-4,4),by+rnd(-4,4)); g.stroke();
      g.fillStyle='#fff'; g.fillRect(p.x-2,p.y-2,4,4);
    } else if(p.kind==='ice'){
      g.fillStyle=SPECTRA.ice.col;
      g.save(); g.translate(p.x,p.y); g.rotate(Math.atan2(p.vy,p.vx));
      g.beginPath(); g.moveTo(8,0); g.lineTo(-6,-4); g.lineTo(-6,4); g.fill(); g.restore();
    } else if(p.kind==='eplasma'){
      g.fillStyle='rgba(255,61,94,0.4)'; g.beginPath(); g.arc(p.x,p.y,8,0,7); g.fill();
      g.fillStyle='#ff8899'; g.beginPath(); g.arc(p.x,p.y,4,0,7); g.fill();
    } else if(p.kind==='ebullet'){
      g.fillStyle='#ffd0a0'; g.fillRect(p.x-4,p.y-1.5,8,3);
    } else if(p.kind==='shock'){
      g.fillStyle='rgba(210,154,85,0.8)';
      g.fillRect(p.x-10,p.y-6,20,18);
      g.fillStyle='rgba(255,220,160,0.8)'; g.fillRect(p.x-10,p.y-10,20,4);
    } else if(p.kind==='missile'){
      g.fillStyle='#ff8866'; g.save(); g.translate(p.x,p.y); g.rotate(Math.atan2(p.vy,p.vx));
      g.fillRect(-6,-3,12,6); g.restore();
      // landing marker
      g.strokeStyle='rgba(255,85,85,'+(0.4+Math.sin(p.t*20)*0.3)+')';
      g.beginPath(); g.arc(p.mark,p.markY-4,10,0,7); g.stroke();
    }
  }
}

function wrapText(g,txt,x,y,maxW,lh){
  const words=txt.split(' ');
  let line='',yy=y;
  for(const w of words){
    const test=line+w+' ';
    if(g.measureText(test).width>maxW&&line){ g.fillText(line,x,yy); line=w+' '; yy+=lh; }
    else line=test;
  }
  g.fillText(line,x,yy);
  return yy;
}

  END_LINES.forEach((l,i)=>{
    if(i<=shown){
      g.fillStyle=i===0?'#ffd94a':'rgba(223,243,255,'+clamp(shown-i,0.35,0.95)+')';
      if(i===0) g.font='bold 16px ui-monospace,monospace'; else g.font='13px ui-monospace,monospace';
      g.fillText(l,VW/2,120+i*24);
    }
  });
  if(game.endT>END_LINES.length*1.1+0.5){
    g.fillStyle='#3ce0ff'; g.font='bold 13px ui-monospace,monospace';
    g.fillText('RUN COMPLETE — TIME '+fmtTime(run.time)+' · SHARDS '+run.shards+'/12 · DEATHS '+run.deaths+' · SCORE '+run.score,VW/2,376);
    g.fillStyle='#ff2fa0'; g.font='bold 15px ui-monospace,monospace';
    g.fillText('"THE PERSON IS THE FINAL COLONY."',VW/2,416);
    if(Math.sin(game.endT*3)>0){
      g.fillStyle='#eaf6ff'; g.font='12px ui-monospace,monospace';
      g.fillText('ENTER — return to title',VW/2,452);
    }
    if(Input.pop('enter')){
      resetRun(); game.state='title'; Input.clearPress();
    }
  }
  g.textAlign='left';
}

// ------------------------------------------------------------------ main loop
let lastT=0;
function frame(ts){
  requestAnimationFrame(frame);
  const dt=Math.min((ts-lastT)/1000||0.016,1/30);
  lastT=ts;
  tick(dt);
  render(dt);
}
function tick(dt){
  // global keys
  if(Input.pop('m')){ Snd.muted=!Snd.muted; }
  if(game.state==='title'){
    if(Input.pop('enter')||Input.pop('touchjump')||Input.pop('touchact')){ resetRun(); loadStage(0); }
    return;
  }
  if(game.state==='card'){
    game.cardT+=dt;
    const any=Object.keys(Input.press).some(k=>Input.press[k]);
    if(game.cardT>0.7&&any){ Input.clearPress(); game.state='play'; }
    if(game.cardT>3.4){ game.state='play'; }
    return;
  }
  if(game.state==='end') return;
  if(Input.pop('p')||Input.pop('escape')){
    game.state=game.state==='pause'?'play':'pause';
  }
  if(game.state==='pause'){
    if(Input.pop('r')){ restoreSnapshot(); game.state='play'; }
    if(Input.pop('t')){ resetRun(); game.state='title'; }
    return;
  }
  // play
  run.time+=dt;
  game.bannerT=Math.max(0,game.bannerT-dt);
  game.loreT=Math.max(0,game.loreT-dt);
  game.cam.shake=Math.max(0,game.cam.shake-40*dt);
  updateDlg(dt);
  updatePlayer(dt);
  updateEnts(dt);
  updateProjs(dt);
  updateParts(dt);
  // camera
  const st=game.stage;
  let cl=0, cr=st.W*TILE-VW;
  if(game.bossActive){ cl=game.arenaL-40; cr=game.arenaR-VW+40; }
  game.cam.x=clamp(lerp(game.cam.x,player.x+player.w/2-VW/2+player.dir*60,1-Math.pow(0.001,dt)),cl,Math.max(cl,cr));
  game.cam.y=clamp(lerp(game.cam.y,player.y+player.h/2-VH/2,1-Math.pow(0.002,dt)),0,Math.max(0,st.H*TILE-VH));
}

// ------------------------------------------------------------------ resize / boot
function fit(){
  const s=Math.min(innerWidth/VW,innerHeight/VH);
  canvas.style.width=(VW*s)+'px'; canvas.style.height=(VH*s)+'px';
}
addEventListener('resize',fit);
addEventListener('blur',()=>{ if(game.state==='play') game.state='pause'; });
fit();
Input.init();
window.DBG={ warp:i=>loadStage(i), game, run, player,
  give:()=>{ run.un={volt:true,fire:true,ice:true,earth:true,dash:true}; } };
requestAnimationFrame(frame);
</script>
